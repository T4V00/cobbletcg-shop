pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'tcgshop'
// common = shared code (vanilla Minecraft only, Mojang names); fabric / neoforge = the loader entry points and glue
include 'common', 'fabric', 'neoforge'
