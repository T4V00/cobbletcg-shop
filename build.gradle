plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

// MasterBall Traders API (cards, packs, rarities, images, platform layer): sibling project ../masterball-api.
// Build it first (cd ../masterball-api && ./gradlew build). CobbleDollars and Cobblemon are used through reflection.
ext.apiDir = rootProject.file('../masterball-api')
ext.apiCommonJar = new File(apiDir, "common/build/libs/masterball-traders-api-common-${api_version}.jar")
ext.apiFabricJar = new File(apiDir, "fabric/build/libs/masterball-traders-api-${api_version}.jar")
ext.apiNeoForgeJar = new File(apiDir, "neoforge/build/libs/masterball-traders-api-neoforge-${api_version}.jar")

// Real Pokemon TCG engine (twinleaf.gg, MIT) run with GraalJS inside the mod
ext.graalModules = ['org.graalvm.polyglot:polyglot', 'org.graalvm.sdk:collections', 'org.graalvm.sdk:nativeimage', 'org.graalvm.sdk:word',
                    'org.graalvm.sdk:jniutils', 'org.graalvm.truffle:truffle-api', 'org.graalvm.truffle:truffle-runtime',
                    'org.graalvm.truffle:truffle-compiler', 'org.graalvm.js:js-language', 'org.graalvm.regex:regex', 'org.graalvm.shadowed:icu4j']
ext.graalVersion = '24.1.1'

subprojects {
    apply plugin: 'java'
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        mavenCentral()
        maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }
}
